# Default values for nginx-chart.

replicaCount: 1

metadata:
  name: nginx-helm-demo
  namespace: nginx-helm

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 81
  targetPort: 81

# Security context settings
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Container port configuration
containerPort: 81
hostPort: 0

# Volume configuration
volumes:
  hostPath:
    enabled: false
    path: /etc
    name: host-vol

# Pod annotations
podAnnotations:
  container.apparmor.security.beta.kubernetes.io/nginx-chart: runtime/default

# Resource limits and requests
resources: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Labels
labels:
  app: nginx

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

# Volume configuration - emptyDir
emptyDirVolume:
  enabled: true
  name: app-vol

# Service account token configuration
automountServiceAccountToken: false
